# Base H2 aislada para pruebas automatizadas.
spring.datasource.url=jdbc:h2:mem:perutalent_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.sql.init.mode=never

# Valores ficticios exclusivos de pruebas. No son credenciales reales.
jwt.secret=PeruTalentTestJwtSecretSeguroSoloParaPruebas1234567890ABCDEF
jwt.expiration=86400000
password-reset.secret=PeruTalentTestPasswordResetSecretSoloParaPruebas1234567890
app.cors.allowed-origins=http://localhost:4200

sendgrid.api-key=
sendgrid.from-email=pruebas@perutalent.local
sendgrid.from-name=PeruTalent Test
app.support-email=insighters.creative@gmail.com

aws.region=sa-east-1
aws.s3.bucket=perutalent-test
aws.s3.prefix=test

culqi.public-key=
culqi.secret-key=
culqi.api-url=https://api.culqi.com/v2
culqi.premium-plan-id=

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
