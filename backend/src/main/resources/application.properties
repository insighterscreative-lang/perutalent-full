spring.application.name=perutalent-api

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false

server.port=${PORT:8081}

# Render solo necesita conocer si la aplicación está disponible.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Hash HMAC rápido para códigos temporales. En producción puede definirse PASSWORD_RESET_SECRET.
# Si no se define, se usa JWT_SECRET como respaldo.
password-reset.secret=${PASSWORD_RESET_SECRET:${JWT_SECRET}}

logging.level.org.springframework.security=WARN
logging.level.com.INSIGHTERS_PERU.Up.Work.Perusalen.security=WARN

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

sendgrid.api-key=${SENDGRID_API_KEY:}
sendgrid.from-email=${SENDGRID_FROM_EMAIL:}
sendgrid.from-name=${SENDGRID_FROM_NAME:PeruTalent}
app.support-email=${SUPPORT_EMAIL:insighters.creative@gmail.com}


aws.region=${AWS_REGION:sa-east-1}
aws.s3.bucket=${AWS_S3_BUCKET:perutalent-cvs-prod-726391}
aws.s3.prefix=${AWS_S3_PREFIX:cvs}
culqi.enabled=${CULQI_ENABLED:false}
culqi.public-key=${CULQI_PUBLIC_KEY:}
culqi.secret-key=${CULQI_SECRET_KEY:}
culqi.api-url=${CULQI_API_URL:https://api.culqi.com/v2}
culqi.premium-plan-id=${CULQI_PREMIUM_PLAN_ID:}
culqi.webhook-token=${CULQI_WEBHOOK_TOKEN:}
