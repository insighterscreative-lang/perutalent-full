spring.application.name=perutalent-api

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.port=${PORT:8081}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

logging.level.org.springframework.security=WARN
logging.level.com.INSIGHTERS_PERU.Up.Work.Perusalen.security=WARN

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

sendgrid.api-key=${SENDGRID_API_KEY:}
sendgrid.from-email=${SENDGRID_FROM_EMAIL:}
sendgrid.from-name=${SENDGRID_FROM_NAME:PeruTalent}

app.upload-dir=${UPLOAD_DIR:/tmp/perutalent/uploads/cvs/postulaciones}

aws.region=${AWS_REGION:sa-east-1}
aws.s3.bucket=${AWS_S3_BUCKET:perutalent-cvs-prod-726391}
aws.s3.prefix=${AWS_S3_PREFIX:cvs}